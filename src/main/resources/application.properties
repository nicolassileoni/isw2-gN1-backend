spring.application.name=saboresdellitoral

# Base H2 en archivo
spring.datasource.url=jdbc:h2:file:./data/sabores_litoral
spring.datasource.username=sa
spring.datasource.password=

# El esquema y los datos iniciales se cargan desde schema.sql y data.sql
# data-demo.sql agrega locales, productos y pedidos de prueba para el entorno local.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql,classpath:data-demo.sql

# Consola de H2
spring.h2.console.enabled=true

spring.jpa.open-in-view=false


# Seguridad JWT
# En producción definir JWT_SECRET con un valor propio de al menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:sabores-del-litoral-dev-secret-change-me-32-chars}
app.jwt.expiration-ms=28800000

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
